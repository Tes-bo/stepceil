<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img">
  <title>The hot kernel is 80 ns of a 1000 ns step</title>
  <desc>pressure runs for 80 ns. The context synchronize blocks the other 920 ns. allow_rewrite is false.</desc>
  <rect width="960" height="360" rx="16" fill="#f4f6f8"/>
  <text x="48" y="52" fill="#1a2332" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="650">The hot kernel is not the step</text>
  <text x="48" y="80" fill="#5c6b7a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">pressure runs 80 ns. The synchronize blocks the other 920 ns.</text>
  <rect x="48" y="112" width="64" height="44" rx="6" fill="#1d4ed8"/>
  <rect x="112" y="112" width="736" height="44" rx="6" fill="#c2410c"/>
  <text x="480" y="140" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" text-anchor="middle">context synchronize, 920 ns</text>
  <text x="48" y="176" fill="#1d4ed8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">pressure</text>
  <text x="848" y="176" fill="#5c6b7a" font-family="ui-monospace, monospace" font-size="13" text-anchor="end">1000 ns</text>
  <text x="48" y="248" fill="#c2410c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="650">920 ns</text>
  <text x="48" y="276" fill="#5c6b7a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">longest blocker</text>
  <text x="48" y="298" fill="#1a2332" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">context synchronize</text>
  <text x="360" y="248" fill="#1d4ed8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="650">80 ns</text>
  <text x="360" y="276" fill="#5c6b7a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">kernel ceiling</text>
  <text x="360" y="298" fill="#1a2332" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">pressure</text>
  <text x="640" y="248" fill="#1a2332" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="650">false</text>
  <text x="640" y="276" fill="#5c6b7a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">allow_rewrite</text>
  <text x="640" y="298" fill="#1a2332" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">under 10% of the step</text>
</svg>
